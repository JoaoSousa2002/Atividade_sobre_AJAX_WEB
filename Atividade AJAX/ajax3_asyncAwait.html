<!DOCTYPE html>
<html>

<body>
  <div id="demo">
    <h1>Requisição por async/await</h1>
    <input type="text" name="cep" id="cep" placeholder="Digite seu CEP">
    <button type="button" onclick="loadDoc()">Pesquisar CEP</button>
    <br>
    <input type="text" id="logradouro" placeholder="Logradouro">
    <br>
    <input type="text" id="complemento" placeholder="Complemento">
    <br>
    <input type="text" id="bairro" placeholder="Bairro">
    <br>
    <input type="text" id="localidade" placeholder="Cidade">
    <br>
    <input type="text" id="uf" placeholder="UF">
  </div>

  <div id="DivErro"> </div>

  <script>
    async function loadDoc() {
      const inicio = performance.now();
      let cep = parseInt(document.getElementById("cep").value);

      try {
        const response = await fetch(`https://viacep.com.br/ws/${cep}/json`)

        if (!response.ok) {
          throw new Error(`'CEP invalido'`);
        }

        let data = await response.json()
        document.getElementById("logradouro").value = data.logradouro;
        document.getElementById("complemento").value = data.complemento;
        document.getElementById("bairro").value = data.bairro;
        document.getElementById("localidade").value = data.localidade;
        document.getElementById("uf").value = data.uf;

      } catch (error) {
        document.getElementById('DivErro').innerHTML =
          `<p style="color: red;">❌ ${error.message}</p>`;
      }
      const fim = performance.now();
      console.log(`Tempo: ${(fim - inicio).toFixed(2)}ms`);
    }
  </script>

</body>

</html>
